name: Build Xiangqi Phone APK
on:
  push:
    branches: [codex/xiangqi-apk-build]
    paths:
      - 'xiangqi-phone-source.zip'
      - '.github/workflows/xiangqi-phone-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unpack isolated Xiangqi project
        run: python -m zipfile -e xiangqi-phone-source.zip .
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Verify rules, UCI and control loop
        working-directory: xiangqi-android
        run: python tools/test_core.py --no-images
      - name: Build APK with official Pikafish
        working-directory: xiangqi-android
        run: python tools/build_apk.py
      - name: Verify APK signature and contents
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose xiangqi-android/XiangqiPhone-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging xiangqi-android/XiangqiPhone-debug.apk
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('xiangqi-android/XiangqiPhone-debug.apk') as z:
              for path in ['lib/arm64-v8a/libpikafish.so','assets/engine/pikafish.nnue','assets/engine/pikafish-source.tar.gz','assets/templates.bin']:
                  assert path in z.namelist(), path
          print('APK contents verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: XiangqiPhone-APK
          path: xiangqi-android/XiangqiPhone-debug.apk
          if-no-files-found: error
          retention-days: 14
